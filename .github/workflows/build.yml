name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: "1.21.4", java: 21 }
          - { version: "1.21.5", java: 21 }
          - { version: "1.21.6-1.21.8", java: 21 }
          - { version: "1.21.9-1.21.10", java: 21 }
          - { version: "1.21.11", java: 21 }
          - { version: "26.1", java: 25 }
          - { version: "26.2", java: 25 }
          - { version: "26.3", java: 25 }
    name: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile
        working-directory: versions/${{ matrix.version }}
        run: sh ./gradlew compileJava compileGametestJava --no-daemon
